<!doctype html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <!-- Small icons for the browser tab, Google search results, and phone home screens.
           Files are in public/. To change them, replace those three files (keep the same names and sizes):
           favicon.ico (16, 32, 48 px), icon-192.png (192 px), apple-touch-icon.png (180 px). -->
      <link rel="icon" href="/favicon.ico" sizes="48x48" />
      <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
      <!-- Makes the page fit phone screens instead of shrinking a desktop layout -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      <!-- Google Analytics (gtag.js): counts visits. It is disclosed in public/privacy.html,
           so if you change or remove it, update the privacy policy too. -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-QG5N6NQJG9"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-QG5N6NQJG9');
      </script>

      <!-- Titillium Web, the site's font, loaded from Google Fonts (also disclosed in the privacy policy).
           The two preconnect lines just start the connection early so the font loads faster. -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
      
      <!-- Page title (browser tab) and description (shown in Google search results) -->
      <title>Toro Welding &amp; Fabrication | Industrial Precision</title>
      <meta name="title" content="Toro Welding &amp; Fabrication | Industrial Precision" />
      <meta name="description" content="High-precision fabrication for Structural, Marine, and Industrial projects in the Coastal Bend. Locally owned and operated in Ingleside, TX." />

      <!-- Tells search engines the official address of this page, so www / non-www or tracking links don't count as duplicates.
           The official address is toro-welding.com WITHOUT "www" (see public/CNAME): GitHub Pages sends www.toro-welding.com
           to it. Use that same address in every full URL in this file, in sitemap.xml, and in robots.txt. -->
      <link rel="canonical" href="https://toro-welding.com/" />

      <!-- Link preview for when the site is shared (Facebook, iMessage, etc.).
           The image is public/thumbnail.jpg (1200 x 630, plain non-progressive JPEG under 300 KB).
           To change the picture, replace that file AND raise the "?v=2" number on the three image lines below
           (og:image, og:image:secure_url, twitter:image). Facebook, Messenger, and others remember the old picture
           by its address, so a new number makes them fetch the new one. -->
      <meta property="og:type" content="website" />
      <meta property="og:url" content="https://toro-welding.com/" />
      <meta property="og:title" content="Toro Welding &amp; Fabrication" />
      <meta property="og:description" content="Mobile &amp; Fully Insured welding services serving the Coastal Bend." />
      <meta property="og:locale" content="en_US" />
      <meta property="og:site_name" content="Toro Welding &amp; Fabrication" />
      <meta property="og:image" content="https://toro-welding.com/thumbnail.jpg?v=2" />
      <meta property="og:image:secure_url" content="https://toro-welding.com/thumbnail.jpg?v=2" />
      <meta property="og:image:type" content="image/jpeg" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <meta property="og:image:alt" content="Toro Welding &amp; Fabrication. Industrial Precision. Mobile and fully insured welding in Ingleside, TX. Call (361) 222-1930." />

      <!-- Same preview for X (Twitter) -->
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:url" content="https://toro-welding.com/" />
      <meta name="twitter:title" content="Toro Welding &amp; Fabrication" />
      <meta name="twitter:description" content="High-precision fabrication for Structural, Marine, and Industrial projects." />
      <meta name="twitter:image" content="https://toro-welding.com/thumbnail.jpg?v=2" />
      <meta name="twitter:image:alt" content="Toro Welding &amp; Fabrication. Industrial Precision. Mobile and fully insured welding in Ingleside, TX. Call (361) 222-1930." />

      <!-- Business details for Google, in a format search engines read (schema.org "LocalBusiness").
           Google says this must match what visitors can see on the page, so keep it in sync with the footer:
           phone, city, and hours (Mon to Fri, 7am to 5pm) all appear there.
           If any of those change, change them here too. Test it at https://search.google.com/test/rich-results -->
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "@id": "https://toro-welding.com/#business",
        "name": "Toro Welding & Fabrication",
        "alternateName": "Toro Welding",
        "url": "https://toro-welding.com/",
        "description": "Mobile and fully insured welding and fabrication in Ingleside, TX. Structural, marine, and industrial projects across the Coastal Bend.",
        "slogan": "Industrial Precision",
        "telephone": "+1-361-222-1930",
        "email": "torowelding@yahoo.com",
        "logo": "https://toro-welding.com/toroweldingLogo.png",
        "image": "https://toro-welding.com/thumbnail.jpg",
        "founder": { "@type": "Person", "name": "Gabino Torres II" },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Ingleside",
          "addressRegion": "TX",
          "addressCountry": "US"
        },
        "areaServed": [
          { "@type": "City", "name": "Ingleside" },
          { "@type": "AdministrativeArea", "name": "Coastal Bend, Texas" }
        ],
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "07:00",
            "closes": "17:00"
          }
        ],
        "sameAs": [
          "https://www.instagram.com/torowelding2024/",
          "https://www.facebook.com/profile.php?id=61560516488673"
        ]
      }
      </script>
    </head>
    <body>
      <!-- React draws the whole site inside this div -->
      <div id="root"></div>
      <!-- Starts the site (src/main.tsx) -->
      <script type="module" src="/src/main.tsx"></script>
      <!-- Instagram's embed script: turns the placeholder in SocialSection.tsx into the live feed.
           Disclosed in the privacy policy. -->
      <script async src="https://www.instagram.com/embed.js"></script>
    </body>
  </html>
